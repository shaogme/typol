[package]
name = "typol-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Command-line tools for checking, formatting, and exporting Typol files."
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true

[[bin]]
name = "typol"
path = "src/main.rs"

[dependencies]
typol = { workspace = true, features = ["config-ir", "std"] }
typol-i18n = { workspace = true, features = ["std"] }
u18n.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/{ name }-v{ version }/{ name }-{ target }-v{ version }{ archive-suffix }"
bin-dir = "{ name }-{ target }-v{ version }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"
disabled-strategies = ["quick-install", "compile"]

[package.metadata.binstall.overrides.'cfg(target_os = "windows")']
pkg-fmt = "zip"
