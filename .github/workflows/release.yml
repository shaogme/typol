name: Release

on:
  push:
    tags:
      - 'typol-cli-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag Name'
        required: true
        type: string

permissions:
  contents: read

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.create.outputs.tag }}
    steps:
      - uses: actions/checkout@main
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Create GitHub release
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          python3 nix/release_assets.py check-tag --tag "$RELEASE_TAG"

          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --generate-notes \
              --verify-tag
          fi

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  upload-assets:
    needs: create-release
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-26.04-arm
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-26.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-26-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.create-release.outputs.tag }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@main
        with:
          ref: ${{ needs.create-release.outputs.tag }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.target }}

      - name: Install musl linker
        if: contains(matrix.target, '-unknown-linux-musl')
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          case "$TARGET" in
            x86_64-unknown-linux-musl)
              echo 'CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc' >> "$GITHUB_ENV"
              ;;
            aarch64-unknown-linux-musl)
              echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc' >> "$GITHUB_ENV"
              ;;
          esac
        shell: bash

      - name: Build binary
        run: cargo build --locked --release --package typol-cli --target "$TARGET"
        shell: bash

      - name: Package and upload Unix archive
        if: runner.os != 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          version="${RELEASE_TAG#typol-cli-v}"
          archive_dir="typol-cli-${TARGET}-v${version}"
          mkdir -p "$archive_dir"
          cp "target/${TARGET}/release/typol" "$archive_dir/"
          tar -czf "${archive_dir}.tar.gz" "$archive_dir"
          gh release upload "$RELEASE_TAG" "${archive_dir}.tar.gz" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
        shell: bash

      - name: Package and upload Windows archive
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (-not $env:RELEASE_TAG.StartsWith('typol-cli-v')) {
            throw 'Expected a tag in the form typol-cli-v<version>.'
          }

          $version = $env:RELEASE_TAG.Substring('typol-cli-v'.Length)
          $archiveDir = "typol-cli-$($env:TARGET)-v$version"
          $archivePath = "$archiveDir.zip"
          New-Item -ItemType Directory -Path $archiveDir -Force | Out-Null
          Copy-Item "target/$($env:TARGET)/release/typol.exe" "$archiveDir/typol.exe"
          Compress-Archive -Path $archiveDir -DestinationPath $archivePath -Force
          gh release upload $env:RELEASE_TAG $archivePath `
            --repo $env:GITHUB_REPOSITORY `
            --clobber
        shell: pwsh

  publish-checksums:
    needs:
      - create-release
      - upload-assets
    runs-on: ubuntu-latest
    concurrency:
      group: nix-release-index
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      RELEASE_TAG: ${{ needs.create-release.outputs.tag }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@main
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Generate and upload SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mkdir release-assets
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'typol-cli-*' \
            --dir release-assets
          (
            cd release-assets
            LC_ALL=C sha256sum --binary typol-cli-* > SHA256SUMS
          )
          gh release upload "$RELEASE_TAG" release-assets/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
        shell: bash

      - name: Generate and propose the Nix release index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          version="${RELEASE_TAG#typol-cli-v}"
          python3 nix/release_assets.py generate \
            --tag "$RELEASE_TAG" \
            --checksums release-assets/SHA256SUMS \
            --output "$RUNNER_TEMP/release-assets.json"
          python3 nix/release_assets.py validate \
            --index "$RUNNER_TEMP/release-assets.json" \
            --checksums release-assets/SHA256SUMS
          if [[ -f nix/release-assets.json ]]; then
            python3 nix/release_assets.py ensure-not-older \
              --candidate "$RUNNER_TEMP/release-assets.json" \
              --existing nix/release-assets.json
          fi

          branch='automation/nix-release-assets'
          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 --wrap=0)"
          git_auth() {
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth_header}" "$@"
          }
          remote_branch_sha="$(git_auth ls-remote --heads origin "$branch" | awk '{ print $1 }')"
          if [[ -n "$remote_branch_sha" ]]; then
            git_auth fetch origin "$branch"
            if git cat-file -e FETCH_HEAD:nix/release-assets.json 2>/dev/null; then
              git show FETCH_HEAD:nix/release-assets.json > "$RUNNER_TEMP/existing-release-assets.json"
              python3 nix/release_assets.py ensure-not-older \
                --candidate "$RUNNER_TEMP/release-assets.json" \
                --existing "$RUNNER_TEMP/existing-release-assets.json"
            fi
          fi

          git switch --create "$branch" "origin/$DEFAULT_BRANCH"
          install -D -m 0644 "$RUNNER_TEMP/release-assets.json" nix/release-assets.json
          git add -- nix/release-assets.json
          if git diff --cached --quiet -- nix/release-assets.json; then
            echo 'Nix release index is already current.'
            if gh pr view "$branch" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
            fi
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Update Nix release index for ${version}"
          if [[ -n "$remote_branch_sha" ]]; then
            git_auth push --force-with-lease="refs/heads/${branch}:${remote_branch_sha}" origin "$branch"
          else
            git_auth push origin "$branch"
          fi

          cat > "$RUNNER_TEMP/pull-request.md" <<EOF
          Update the generated Nix release index for ${RELEASE_TAG}.

          The archive names and SRI SHA-256 values were generated from the release's uploaded
          SHA256SUMS file. Do not edit these values by hand.
          EOF
          if ! gh pr view "$branch" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base "$DEFAULT_BRANCH" \
              --head "$branch" \
              --title "Update Nix release index for ${version}" \
              --body-file "$RUNNER_TEMP/pull-request.md"
          fi
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
        shell: bash
